<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAKVISTA-PLUS</title>
<style>
body{font-family:Arial;background:#eef4fb;margin:0;padding:16px}
.card{max-width:760px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
h1{text-align:center;color:#0A4DA3;margin:0}
.sub{text-align:center;color:#64748b;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=date]{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}
.item{margin:10px 0}.head{display:flex;justify-content:space-between;font-size:14px;font-weight:bold}
input[type=range]{width:100%}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#0A4DA3;color:#fff;font-size:16px;font-weight:bold;margin-top:15px;cursor:pointer}
.result{background:#f5f9ff;border-radius:12px;padding:15px;margin-top:18px;text-align:center}
#grade{font-size:46px;font-weight:bold;color:#0A4DA3}
svg{width:100%;height:280px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
ul{padding-left:20px}
@media(max-width:700px){.grid,.cols{grid-template-columns:1fr}}
@media print{button{display:none}body{background:#fff}}
</style>
</head>
<body>

<div class="card" id="report">

<h1>LAKVISTA-PLUS</h1>
<div class="sub">Business Credit Rating Simulator</div>

<div class="grid">
<div>
<label>Company Name</label>
<input id="company" type="text" placeholder="Enter Company Name">
</div>
<div>
<label>Assessment Date</label>
<input id="adate" type="date">
</div>
</div>

<div id="sliders"></div>

<button onclick="calc()">Calculate Credit Rating</button>

<div class="result">
<div id="grade">--</div>
<h2 id="score">Credit Score : --</h2>
<div id="risk">Move sliders and calculate</div>
</div>

<h3>Financial Strength Radar</h3>

<svg viewBox="0 0 300 300">
<g stroke="#d1d5db" fill="none">
<polygon points="150,20 225,45 275,100 275,200 225,255 150,280 75,255 25,200 25,100 75,45"/>
<polygon points="150,55 205,73 240,110 240,190 205,227 150,245 95,227 60,190 60,110 95,73"/>
<polygon points="150,90 185,101 205,120 205,180 185,199 150,210 115,199 95,180 95,120 115,101"/>
</g>
<polygon id="shape" fill="#2563EB55" stroke="#2563EB" stroke-width="2"/>
</svg>

<div class="cols">
<div>
<h3>Strengths</h3>
<ul id="strengths"></ul>
</div>
<div>
<h3>Recommendations</h3>
<ul id="recom"></ul>
</div>
</div>

<h3>Rating Rationale</h3>
<p id="rationale"></p>

<button onclick="window.print()">Download PDF Report</button>

</div>

<script>
const factors=[
["Payment History",0,100,85],
["Current Ratio",0,5,2],
["Quick Ratio",0,3,1.2],
["Debt-Equity Ratio",0,5,1],
["Interest Coverage Ratio",0,15,5],
["ROA (%)",0,25,10],
["ROCE (%)",0,30,15],
["Net Profit Margin (%)",0,30,12],
["Operating Profit Margin (%)",0,30,18],
["Total Asset Turnover",0,3,1.5]
];

const box=document.getElementById("sliders");

factors.forEach((f,i)=>{
box.innerHTML+=`
<div class="item">
<div class="head">
<span>${i+1}. ${f[0]}</span>
<span id="v${i}">${f[3]}</span>
</div>
<input type="range" id="s${i}" min="${f[1]}" max="${f[2]}"
step="0.1" value="${f[3]}"
oninput="document.getElementById('v${i}').innerText=this.value">
</div>`;
});

function norm(i,v){
switch(i){
case 0:return v/100;
case 1:return Math.min(v,2)/2;
case 2:return Math.min(v,1);
case 3:return Math.max(0,(5-v))/5;
case 4:return Math.min(v,10)/10;
case 5:return Math.min(v,20)/20;
case 6:return Math.min(v,25)/25;
case 7:return Math.min(v,20)/20;
case 8:return Math.min(v,25)/25;
case 9:return Math.min(v,2)/2;
}
}

function radar(vals){
const cx=150,cy=150,R=120;
let pts=[];
vals.forEach((v,i)=>{
let a=(-90+i*36)*Math.PI/180;
let rr=R*v;
pts.push((cx+rr*Math.cos(a))+","+(cy+rr*Math.sin(a)));
});
shape.setAttribute("points",pts.join(" "));
}

function calc(){

let total=0,list=[];

for(let i=0;i<10;i++){
let raw=parseFloat(document.getElementById("s"+i).value);
let sc=norm(i,raw);
total+=sc*10;
list.push({name:factors[i][0],score:sc});
}

total=Math.round(total);

let g,r;
if(total>=90){g="AAA";r="Exceptional Credit Quality";}
else if(total>=80){g="AA";r="Very Strong Credit Profile";}
else if(total>=70){g="A";r="Strong Financial Stability";}
else if(total>=60){g="BBB";r="Adequate Credit Strength";}
else if(total>=50){g="BB";r="Moderate Credit Risk";}
else if(total>=40){g="B";r="High Credit Risk";}
else{g="C";r="Very High Default Risk";}

grade.innerText=g;
score.innerText="Credit Score : "+total+"/100";
risk.innerText=r;

radar(list.map(x=>x.score));

let sorted=[...list].sort((a,b)=>b.score-a.score);

strengths.innerHTML="";
sorted.slice(0,3).forEach(x=>{
strengths.innerHTML+=`<li><b>${x.name}</b> is a major strength.</li>`;
});

recom.innerHTML="";
sorted.slice(-3).forEach(x=>{
recom.innerHTML+=`<li>Improve <b>${x.name}</b>.</li>`;
});

let c=company.value||"the company";
rationale.innerHTML=`LAKVISTA-PLUS assigns a <b>${g}</b> rating to <b>${c}</b> with a Credit Score of <b>${total}/100</b>. The assessment is based on liquidity, solvency, profitability and operational efficiency indicators.`;

}

adate.value=new Date().toISOString().split("T")[0];
calc();
</script>

</body>
</html>
