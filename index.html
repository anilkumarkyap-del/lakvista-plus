
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAKVISTA-PLUS</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef4fb;margin:0;padding:16px}
.card{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.12)}
h1{text-align:center;color:#0A4DA3;margin:0}
.sub{text-align:center;color:#64748b;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:bold;font-size:14px}
input[type=text],input[type=date]{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}
.row{margin:12px 0}
.head{display:flex;justify-content:space-between;font-size:14px;font-weight:bold}
input[type=range]{width:100%}
button{width:100%;padding:13px;background:#0A4DA3;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:16px}
.result{background:#f5f9ff;border-radius:12px;padding:16px;margin-top:20px;text-align:center}
#grade{font-size:48px;font-weight:bold;color:#0A4DA3}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
ul{padding-left:20px}
svg{width:100%;height:300px}
@media(max-width:700px){.grid,.cols{grid-template-columns:1fr}}
@media print{
button{display:none}
body{background:#fff}
.card{box-shadow:none}
}
</style>
</head>
<body>

<div class="card" id="report">

<h1>LAKVISTA-PLUS</h1>
<div class="sub">Business Credit Rating Simulator</div>

<div class="grid">
<div>
<label>Company Name</label>
<input id="company" type="text" placeholder="Enter Company Name">
</div>
<div>
<label>Assessment Date</label>
<input id="adate" type="date">
</div>
</div>

<div id="sliders"></div>

<button onclick="calculate()">Calculate Credit Rating</button>

<div class="result">
<div id="grade">--</div>
<h2 id="score">Credit Score : --</h2>
<p id="risk">Move sliders and calculate</p>
</div>

<h2>Financial Strength Radar</h2>

<svg viewBox="0 0 300 300">
<g stroke="#d1d5db" fill="none">
<polygon points="150,20 225,45 275,100 275,200 225,255 150,280 75,255 25,200 25,100 75,45"/>
<polygon points="150,55 205,73 240,110 240,190 205,227 150,245 95,227 60,190 60,110 95,73"/>
<polygon points="150,90 185,101 205,120 205,180 185,199 150,210 115,199 95,180 95,120 115,101"/>
</g>
<polygon id="shape" fill="#2563EB55" stroke="#2563EB" stroke-width="2"/>
</svg>

<div class="cols">

<div>
<h3>Strengths</h3>
<ul id="strengths"></ul>
</div>

<div>
<h3>Recommendations</h3>
<ul id="recommendations"></ul>
</div>

</div>

<h3>Rating Rationale</h3>
<p id="rationale"></p>

<button onclick="window.print()">Download PDF Report</button>

</div>

<script>
const factors=[
["Payment History",0,100,85],
["Current Ratio",0,5,2],
["Quick Ratio",0,3,1.2],
["Debt–Equity Ratio",0,5,1],
["Interest Coverage Ratio",0,15,5],
["Cash Flow Strength",0,100,75],
["Net Profit Margin (%)",0,30,12],
["Business Stability (Years)",0,30,10],
["Industry Risk",1,5,2],
["Management Quality",1,5,4]
];

const sliders=document.getElementById("sliders");

factors.forEach((f,i)=>{
sliders.innerHTML+=`
<div class="row">
<div class="head">
<span>${i+1}. ${f[0]}</span>
<span id="v${i}">${f[3]}</span>
</div>
<input type="range" id="s${i}"
min="${f[1]}" max="${f[2]}"
step="0.1" value="${f[3]}"
oninput="document.getElementById('v${i}').innerText=this.value">
</div>`;
});

const weight=[20,10,5,15,15,10,10,5,5,5];

function normalize(index,value){

switch(index){

case 0:return value/100;

case 1:return Math.min(value,2)/2;

case 2:return Math.min(value,1);

case 3:return Math.max(0,(5-value))/5;

case 4:return Math.min(value,10)/10;

case 5:return value/100;

case 6:return Math.min(value,20)/20;

case 7:return Math.min(value,20)/20;

case 8:return (5-value)/4;

case 9:return (value-1)/4;

}

}

function drawRadar(scores){

const cx=150,cy=150,R=120;

let pts=[];

scores.forEach((s,i)=>{

const ang=(-90+i*36)*Math.PI/180;

const rr=R*s;

const x=cx+rr*Math.cos(ang);

const y=cy+rr*Math.sin(ang);

pts.push(`${x},${y}`);

});

document.getElementById("shape").setAttribute("points",pts.join(" "));

}

function calculate(){

let total=0;

let items=[];

for(let i=0;i<10;i++){

const raw=parseFloat(document.getElementById("s"+i).value);

const sc=normalize(i,raw);

total+=sc*weight[i];

items.push({
name:factors[i][0],
score:sc
});

}

total=Math.round(total);

let grade,risk;

if(total>=90){
grade="AAA";
risk="Exceptional Credit Quality";
}
else if(total>=80){
grade="AA";
risk="Very Strong Credit Profile";
}
else if(total>=70){
grade="A";
risk="Strong Financial Stability";
}
else if(total>=60){
grade="BBB";
risk="Adequate Credit Strength";
}
else if(total>=50){
grade="BB";
risk="Moderate Credit Risk";
}
else if(total>=40){
grade="B";
risk="High Credit Risk";
}
else{
grade="C";
risk="Very High Default Risk";
}

document.getElementById("grade").innerText=grade;
document.getElementById("score").innerText=`Credit Score : ${total}/100`;
document.getElementById("risk").innerText=risk;

drawRadar(items.map(x=>x.score));

const sorted=[...items].sort((a,b)=>b.score-a.score);

const strengths=document.getElementById("strengths");
strengths.innerHTML="";
sorted.slice(0,3).forEach(x=>{
strengths.innerHTML+=`<li><b>${x.name}</b> is a significant strength.</li>`;
});

const advice={
"Payment History":"Maintain timely repayment of all credit obligations.",
"Current Ratio":"Increase current assets or reduce current liabilities.",
"Quick Ratio":"Improve liquid assets and cash availability.",
"Debt–Equity Ratio":"Reduce debt or strengthen shareholders' equity.",
"Interest Coverage Ratio":"Increase EBIT or reduce interest burden.",
"Cash Flow Strength":"Strengthen operating cash flow generation.",
"Net Profit Margin (%)":"Improve profitability through cost efficiency.",
"Business Stability (Years)":"Strengthen long-term business continuity.",
"Industry Risk":"Diversify markets to reduce industry exposure.",
"Management Quality":"Enhance governance and managerial effectiveness."
};

const rec=document.getElementById("recommendations");
rec.innerHTML="";
sorted.slice(-3).forEach(x=>{
rec.innerHTML+=`<li>${advice[x.name]}</li>`;
});

const company=document.getElementById("company").value || "the company";

document.getElementById("rationale").innerHTML=
`LAKVISTA-PLUS assigns a <b>${grade}</b> rating to <b>${company}</b> with a Credit Score of <b>${total}/100</b>. The assessment is based on repayment behaviour, liquidity, leverage, debt servicing capacity, cash flow strength, profitability, business stability, industry risk and management quality.`;

}

document.getElementById("adate").value=
new Date().toISOString().split("T")[0];

calculate();
</script>

</body>
</html>
